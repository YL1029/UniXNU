name: macOS Data seed

# Builds the ephemeral Data volume (/private/var) for the macOS 14.6.1 VM:
# an APFS container named Data, seeded from the installer's
# /System/Library/Templates/Data, renamed to the UUID the kernel expects
# (CONFIG_XNU_OWNER_DATA_VOLUME_UUID) and packed into the DBRDISK1 sparse RAM
# disk that DarwinBoot and NativeRamBlock read. The result is published as a
# release asset so build_droidvm_boot.sh can embed it in the ESP.
on:
  workflow_dispatch:
  push:
    branches: [build-droidvm]
    paths: ['.github/workflows/macos-data-seed.yml']

permissions:
  contents: write

env:
  IPSW_URL: https://updates.cdn-apple.com/2024SummerFCS/fullrestores/062-52859/932E0A8F-6644-4759-82DA-F8FA8DEA806A/UniversalMac_14.6.1_23G93_Restore.ipsw
  OS_DMG: 090-91706-091.dmg
  DATA_UUID: 8748FE31-7E7F-4BFA-A7E2-7A4F5E14D0F6

jobs:
  seed:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the macOS restore image
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 -o ipsw.zip "$IPSW_URL"
          unzip -p ipsw.zip "$OS_DMG" > os.dmg
          ls -l os.dmg

      - name: Build the Data volume from the installer template
        run: |
          set -euo pipefail
          OSM=$(mktemp -d)
          sudo hdiutil attach -readonly -nobrowse -mountpoint "$OSM" os.dmg
          TEMPLATE="$OSM/System/Library/Templates/Data"
          ls -ld "$TEMPLATE" "$TEMPLATE/private/var"
          hdiutil create -size 2g -fs APFS -volname Data -ov -o data.dmg
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -mountpoint "$MNT" data.dmg
          sudo rsync -aH "$TEMPLATE/private/var/" "$MNT/"
          for directory in tmp log run vm folders db/dslocal/nodes/Default; do
            sudo mkdir -p "$MNT/$directory"
          done
          sudo chmod 1777 "$MNT/tmp"
          # The bulky read-only parts of /Library stay on the SystemOS disk; the
          # packed RAM disk holds at most 256 MiB of nonzero pages.
          READONLY=(Library/Apple "Library/Application Support/Apple" Library/Documentation Library/WebServer)
          for path in Library Users Applications Volumes cores opt usr/local System/Library/Caches private/etc; do
            sudo mkdir -p "$MNT/.data/$(dirname "$path")"
            if [ -e "$TEMPLATE/$path" ]; then
              sudo rsync -aH "${READONLY[@]/#/--exclude=/}" "$TEMPLATE/$path" "$MNT/.data/$(dirname "$path")/"
            else
              sudo mkdir -p "$MNT/.data/$path"
            fi
          done
          for path in "${READONLY[@]}"; do
            sudo ln -sfn "/System/Volumes/Data/$path" "$MNT/.data/$path"
          done
          sudo chmod 1777 "$MNT/.data/Volumes" 2>/dev/null || true
          sync
          hdiutil detach "$MNT"
          sudo hdiutil detach "$OSM"
          ls -l data.dmg

      - name: Extract the container and name the volume
        run: |
          set -euo pipefail
          DEV=$(hdiutil attach -nomount data.dmg | awk '{print $1}' | head -1)
          sudo dd if="${DEV/disk/rdisk}" of=data.raw bs=1m status=progress
          hdiutil detach "$DEV"
          OFFSET=$(python3 - <<'PY'
          data = open('data.raw', 'rb').read(1 << 20)
          print(max(data.find(b'NXSB', 32) - 32, 0))
          PY
          )
          python3 macOS-DroidVM/scripts/apfs-volumes.py data.raw "$OFFSET"
          OLD=$(python3 - "$OFFSET" <<'PY'
          import re, subprocess, sys
          offset = sys.argv[1]
          listing = subprocess.run(['python3', 'macOS-DroidVM/scripts/apfs-volumes.py', 'data.raw', offset],
                                   capture_output=True, text=True, check=True).stdout
          for line in listing.splitlines():
              if 'role Data' in line:
                  match = re.search(r'uuid ([0-9A-F-]{36})', line)
                  if match:
                      print(match.group(1))
                      break
          PY
          )
          python3 macOS-DroidVM/scripts/apfs-volumes.py data.raw "$OFFSET" --set-uuid "$OLD" "$DATA_UUID"
          python3 macOS-DroidVM/scripts/apfs-volumes.py data.raw "$OFFSET"
          python3 UniXNU/scripts/pack-data-ramdisk.py data.raw scratch-data.img
          ls -l scratch-data.img

      - name: Publish the seed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view macos-data-seed -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create macos-data-seed -R "$GITHUB_REPOSITORY" \
              --title "macOS Data seed" \
              --notes "DBRDISK1 Data volume seed (UUID $DATA_UUID) for the macOS 14.6.1 (23G93) VM."
          gh release upload macos-data-seed scratch-data.img -R "$GITHUB_REPOSITORY" --clobber
